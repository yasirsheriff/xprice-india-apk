name: Collect Xbox India prices

# Runs daily at 02:30 IST. Scheduled workflows only run from the repository's
# default branch, so this file must be on that branch.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout collector script
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout price-data branch (create it on first run)
        run: |
          git clone --depth 1 --branch price-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data \
            || { mkdir data && cd data && git init -b price-data && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect prices
        run: python3 src/tools/price-collector/collect.py --data-dir data --workers 4

      - name: Commit and push
        working-directory: data
        run: |
          git config user.name "lootwise-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Prices $(TZ=Asia/Kolkata date +%F)"
            git push origin price-data
          fi
