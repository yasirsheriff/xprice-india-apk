name: Collect Xbox India prices

# Runs automatically every day at 02:30 IST - no manual trigger needed.
#  1. Live prices for every Xbox India game (~5 min)
#  2. Archive backfill: genuine past prices from web.archive.org for the most
#     popular games, ~50 min per day, resuming where it stopped
# Scheduled workflows only run from the repository's default branch (Main).
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets the keep-alive step stop GitHub disabling the schedule

concurrency:
  group: price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout collector script
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout price-data branch (create it on first run)
        run: |
          git clone --depth 1 --branch price-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data \
            || { mkdir data && cd data && git init -b price-data && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect prices
        run: python3 src/tools/price-collector/collect.py --data-dir data --workers 4 --backfill-minutes 50

      - name: Commit and push
        if: ${{ !cancelled() }}   # keep partial backfill progress even if a later step failed
        working-directory: data
        run: |
          git config user.name "lootwise-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Prices $(TZ=Asia/Kolkata date +%F)"
            git push origin price-data
          fi

      # GitHub disables scheduled workflows in public repos after 60 days without
      # repository activity. Re-enabling it on every run keeps the daily schedule alive.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/price-collector.yml/enable" || true
